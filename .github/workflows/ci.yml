name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test-oracle-mcp:
    name: oracle-mcp-server (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle-mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run unit tests
        run: |
          pytest -v -m unit

  lint-and-test-db-copilot:
    name: db-copilot (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db-copilot

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run unit tests
        run: |
          pytest -v -m "not integration"
