[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oracle-mcp-server"
version = "0.1.0"
description = "Oracle Database Observability MCP Server — read-only evidence gateway"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.0.0",
    "oracledb>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
oracle-mcp-server = "oracle_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real Oracle instance",
    "unit: fast, no external dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
